<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F2EEE6">
  <title>Kintsugi Banderilla — Menú</title>
  <script src="https://cdn.tailwindcss.com/3.4.16?plugins=forms,container-queries"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Caveat:wght@700&family=Noto+Sans+JP:wght@400;700&family=Permanent+Marker&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/kintsugi.css">
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
</head>
<body class="bg-light-surface text-ink-black font-body antialiased">
  <div id="app" class="relative min-h-app max-w-md mx-auto bg-light-surface flex flex-col overflow-x-hidden"></div>

  <script>
    (function () {
      var S = KStore, U = KUI, esc = U.esc, D = S.data;

      var sid = U.param('s');
      if (!S.seccion(sid)) sid = D.secciones[0].id;
      var seccion = S.seccion(sid);
      document.title = 'Kintsugi Banderilla — ' + seccion.nombre;

      var etiquetaChip = 'px-gutter-xs py-0.5 rounded-sm font-label text-label-sm';

      function agotado(p) {
        return p.disponible ? '' : '<span class="' + etiquetaChip + ' bg-smoke-gray text-washi">Agotado</span>';
      }

      function price(p, size) {
        return '<span class="font-price text-' + (size || 'price-md') + ' text-ink-black tabular-nums' + (p.disponible ? '' : ' line-through opacity-60') + '">' + U.money(p.precio) + '</span>';
      }

      function jpSmall(p) {
        return p.jp ? '<span class="font-body text-body-sm text-smoke-gray shrink-0" aria-hidden="true">' + esc(p.jp) + '</span>' : '';
      }

      // Una fila de platillo según el estilo de su categoría.
      function row(p, cat, last) {
        var line = last ? ' pt-gutter-xs' : ' py-gutter-xs border-b border-ink-black/15';
        var dim = p.disponible ? '' : ' opacity-70';
        var sub = p.sub ? '<span class="font-body text-body-sm text-smoke-gray' + (cat.subMayus ? ' uppercase' : '') + '">' + esc(p.sub) + '</span>' : '';
        var name = '<h3 class="font-headline text-title-md text-ink-black uppercase">' + esc(p.nombre) + '</h3>';

        if (cat.estilo === 'ramen' && p.etiquetas.indexOf('Especialidad') !== -1) {
          return '<a href="producto.html?id=' + esc(p.id) + '" class="flex items-start justify-between gap-gutter-sm' + line + dim + '">' +
            '<div class="flex flex-col gap-gutter-xs min-w-0">' +
              '<div class="flex items-baseline gap-gutter-xs flex-wrap">' + jpSmall(p) + name +
                '<span class="' + etiquetaChip + ' bg-primary text-on-primary">Especialidad</span>' + agotado(p) + '</div>' +
              (p.sub ? '<p class="font-body text-body-sm text-ink-black text-pretty">' + esc(p.sub) + '</p>' : '') +
            '</div>' +
            '<div class="flex flex-col items-end gap-gutter-xs shrink-0">' + price(p, 'price-lg') +
              (p.img ? '<img src="' + esc(U.src(p.img)) + '" alt="' + esc(p.nombre) + '" class="w-12 h-12 rounded-full object-cover border-2 border-kintsugi-gold">' : '') +
            '</div></a>';
        }

        if (cat.estilo === 'ramen') {
          var left = p.sub
            ? '<div class="flex flex-col min-w-0"><div class="flex items-baseline gap-gutter-xs">' + jpSmall(p) + name + '</div>' + sub + '</div>'
            : '<div class="flex items-baseline gap-gutter-xs min-w-0">' + jpSmall(p) + name + '</div>';
          return '<a href="producto.html?id=' + esc(p.id) + '" class="flex items-center justify-between gap-gutter-sm' + line + dim + '">' + left +
            '<div class="flex items-center gap-gutter-sm shrink-0">' + agotado(p) + price(p) +
              (p.img ? '<img src="' + esc(U.src(p.img)) + '" alt="' + esc(p.nombre) + '" class="w-11 h-11 rounded-full object-cover border border-kintsugi-gold">' : '') +
            '</div></a>';
        }

        if (cat.estilo === 'sushi') {
          return '<a href="arma-tu-sushi.html?rollo=' + esc(p.id) + '" class="flex items-center justify-between gap-gutter-sm' + line + dim + '">' +
            '<div class="flex flex-col min-w-0"><h3 class="font-headline text-title-md text-ink-black uppercase">' + esc(p.nombre) +
              (p.jp ? ' <span class="font-body text-body-sm text-smoke-gray font-normal">' + esc(p.jp) + '</span>' : '') + '</h3>' + sub + '</div>' +
            '<div class="flex items-center gap-gutter-sm shrink-0">' + agotado(p) + price(p) +
              (p.img ? '<img src="' + esc(U.src(p.img)) + '" alt="' + esc(p.nombre) + '" class="w-12 h-12 rounded-md object-cover border border-kintsugi-gold">' : '') +
            '</div></a>';
        }

        // estilo 'lista'
        return '<a href="producto.html?id=' + esc(p.id) + '" class="flex items-center justify-between gap-gutter-sm' + line + dim + '">' +
          '<div class="flex flex-col min-w-0">' + name + (p.sub ? '<p class="font-body text-body-sm text-smoke-gray' + (cat.subMayus ? ' uppercase' : '') + '">' + esc(p.sub) + '</p>' : '') + '</div>' +
          '<div class="flex items-center gap-gutter-xs shrink-0">' + agotado(p) +
            (p.img ? '<img src="' + esc(U.src(p.img)) + '" alt="' + esc(p.nombre) + '" class="w-10 h-10 rounded-full object-cover border border-kintsugi-gold">' : '') +
            price(p) + '</div></a>';
      }

      function vertical(cat) {
        if (!cat.vertical) return '';
        var len = Array.from(cat.vertical).length;
        var size = len <= 5 ? 'text-headline-lg' : (len <= 7 ? 'text-headline-md' : 'text-title-md');
        var side = cat.lado === 'izq' ? 'pr-gutter-xs border-r' : 'pl-gutter-xs border-l';
        return '<div class="flex flex-col items-center justify-center shrink-0 ' + side + ' border-ink-black/20">' +
          '<span class="jp-vertical ' + size + ' text-ink-black font-bold tracking-widest" aria-hidden="true">' + esc(cat.vertical) + '</span></div>';
      }

      function armableBlock() {
        var cfg = D.sushi;
        var ings = cfg.ingredientes.filter(function (i) { return i.activo; });
        return '<div class="border-t border-ink-black/25 pt-gutter-sm flex flex-col gap-gutter-sm">' +
          '<h4 class="text-center font-headline text-title-md text-ink-black uppercase">Elija ' + cfg.incluidos + ' ingredientes:</h4>' +
          // Columna por columna, como en la carta impresa (izquierda: proteínas, derecha: verduras y fruta).
          '<div class="grid grid-cols-2 grid-flow-col gap-x-gutter-md gap-y-gutter-xs px-gutter-sm font-body text-body-sm text-ink-black uppercase" style="grid-template-rows:repeat(' + Math.ceil(ings.length / 2) + ',auto)">' +
            ings.map(function (i) { return '<span>• ' + esc(i.nombre) + '</span>'; }).join('') +
          '</div>' +
          '<div class="text-center border-t border-ink-black/15 pt-gutter-xs"><p class="font-label text-label-sm text-ink-black uppercase">' +
            'Ingrediente extra — Verduras: ' + U.money(cfg.extraVerdura) + ' c/u · Proteínas: ' + U.money(cfg.extraProteina) + ' c/u</p></div>' +
          '<a href="arma-tu-sushi.html" class="inline-flex items-center justify-center gap-gutter-sm w-full py-gutter-sm px-gutter-lg rounded-full bg-primary text-on-primary border border-kintsugi-gold">' +
            '<span class="material-symbols-outlined text-title-md" aria-hidden="true">auto_awesome</span><span class="font-label text-label-lg">Arma tu sushi ahora</span></a>' +
        '</div>';
      }

      function card(cat) {
        var items = S.productosDe(cat.id);
        if (!items.length) return '';
        var list = '<div class="flex-1 min-w-0 flex flex-col gap-gutter-sm">' +
          items.map(function (p, i) { return row(p, cat, i === items.length - 1); }).join('') + '</div>';
        var body = '<div class="flex items-stretch gap-gutter-sm">' +
          (cat.lado === 'izq' ? vertical(cat) + list : list + vertical(cat)) + '</div>';
        var head = cat.mostrarTitulo
          ? '<div class="flex flex-col items-center text-center gap-gutter-xs border-b border-ink-black/25 pb-gutter-sm">' +
              '<h2 class="font-display text-headline-lg text-primary tracking-wider uppercase">' + esc(cat.nombre) + '</h2>' +
              (cat.nota ? '<p class="font-body text-body-sm text-ink-black text-pretty">' + esc(cat.nota) + '</p>' : '') + '</div>'
          : '<h2 class="sr-only">' + esc(cat.nombre) + '</h2>';
        return '<section data-category="' + esc(cat.id) + '" class="relative z-10 rounded-xl border-2 border-ink-black/80 bg-washi/90 p-gutter-md flex flex-col gap-gutter-md">' +
          head + body + (cat.armable ? armableBlock() : '') + '</section>';
      }

      function promoCard(pr) {
        var first = S.producto(pr.productos[0]);
        var esRollo = first && (S.categoria(first.cat) || {}).armable;
        var href = esRollo ? 'arma-tu-sushi.html?rollo=' + first.id : (first ? 'producto.html?id=' + first.id : '#');
        return '<section aria-label="Promoción vigente" class="relative z-10 rounded-lg border-2 border-ink-black/70 bg-washi/85 p-gutter-md">' +
          '<div class="flex items-center justify-between gap-gutter-md"><div class="flex flex-col gap-gutter-xs min-w-0">' +
            '<span class="inline-flex self-start items-center px-gutter-sm py-0.5 rounded-sm bg-primary text-on-primary font-label text-label-sm">PROMO DEL MES</span>' +
            '<h2 class="font-headline text-title-md text-ink-black uppercase">' + esc(pr.titulo) + '</h2>' +
            '<p class="font-body text-body-sm text-smoke-gray">' + esc(pr.subtitulo) + '</p></div>' +
          '<a href="' + esc(href) + '" class="px-gutter-md py-gutter-xs rounded-full bg-primary text-on-primary font-label text-label-sm shrink-0">' + (esRollo ? 'Armar' : 'Ver') + '</a>' +
          '</div></section>';
      }

      var promos = S.promosActivas().filter(function (pr) {
        return pr.portada && pr.productos.some(function (id) { return S.seccionDeProducto(id) === sid; });
      });

      var cards = S.categoriasDe(sid).map(card).join('');

      document.getElementById('app').innerHTML =
        U.menuHeader(sid) +
        '<main class="relative z-10 flex-1 px-page-margin py-gutter-lg flex flex-col gap-gutter-lg overflow-hidden">' +
          U.fondo(sid) +
          promos.map(promoCard).join('') +
          (cards || '<p class="relative z-10 rounded-lg bg-washi/90 p-gutter-lg text-center font-body text-body-md text-smoke-gray">Pronto agregaremos platillos en esta sección.</p>') +
        '</main>' +
        U.footer();
    })();
  </script>
</body>
</html>
