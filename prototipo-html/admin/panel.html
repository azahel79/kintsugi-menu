<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAF8F4">
  <meta name="robots" content="noindex">
  <title>Kintsugi Banderilla — Panel</title>
  <script>window.KROOT = '../';</script>
  <script src="https://cdn.tailwindcss.com/3.4.16?plugins=forms,container-queries"></script>
  <script src="../assets/js/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Caveat:wght@700&family=Noto+Sans+JP:wght@400;700&family=Permanent+Marker&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/kintsugi.css">
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script>KUI.guard();</script>
</head>
<body class="bg-light-surface text-ink-black font-body antialiased">
  <div id="app" class="relative min-h-app max-w-md mx-auto bg-light-surface flex flex-col overflow-x-hidden"></div>

  <script>
    (function () {
      var S = KStore, U = KUI, esc = U.esc, D = S.data;

      var activos = D.productos.filter(function (p) { return p.disponible; }).length;
      var agotados = D.productos.length - activos;
      var promos = S.promosActivas().length;
      var ings = D.sushi.ingredientes.filter(function (i) { return i.activo; }).length;

      function acceso(href, color, icon, titulo, texto) {
        return '<a href="' + href + '" class="flex items-center justify-between gap-gutter-md p-gutter-md rounded-md bg-light-surface-container-low border border-kintsugi-gold hover:border-primary">' +
          '<div class="flex items-center gap-gutter-md"><div class="w-11 h-11 rounded-md ' + color + ' flex items-center justify-center shrink-0">' +
            '<span class="material-symbols-outlined text-headline-md" aria-hidden="true">' + icon + '</span></div>' +
          '<div class="flex flex-col"><span class="font-headline text-title-md text-ink-black">' + titulo + '</span>' +
            '<span class="font-body text-body-sm text-smoke-gray">' + texto + '</span></div></div>' +
          '<span class="material-symbols-outlined text-smoke-gray" aria-hidden="true">chevron_right</span></a>';
      }

      document.getElementById('app').innerHTML =
        U.adminBg() +
        U.adminHeader('Panel de Administración',
          '<a href="../menu.html" target="_blank" class="inline-flex items-center gap-1 px-gutter-md py-gutter-xs rounded-full bg-secondary text-on-secondary font-label text-label-sm shrink-0">' +
          '<span class="material-symbols-outlined text-body-md" aria-hidden="true">visibility</span><span>Ver menú</span></a>') +

        '<main class="relative z-10 flex-1 px-page-margin py-gutter-lg flex flex-col gap-gutter-xl">' +
          '<section class="rounded-lg bg-light-surface-container-low border-2 border-kintsugi-gold p-gutter-lg flex items-center justify-between gap-gutter-md">' +
            '<div class="flex flex-col gap-gutter-xs">' +
              '<span class="inline-flex self-start items-center gap-1 px-gutter-sm py-0.5 rounded-sm bg-success text-on-success font-label text-label-sm"><span class="material-symbols-outlined text-body-sm" aria-hidden="true">check_circle</span>Menú en línea</span>' +
              '<h1 class="font-headline text-headline-md text-ink-black">¡Hola! Todo listo hoy</h1>' +
              '<p class="font-body text-body-sm text-smoke-gray">Tus cambios se reflejan al instante en el código QR.</p>' +
            '</div>' +
            '<img src="' + esc(U.src(D.mascota)) + '" alt="Panda Kintsugi" class="w-16 h-16 rounded-full object-cover object-top border-2 border-kintsugi-gold shrink-0">' +
          '</section>' +

          '<section aria-label="Resumen del menú" class="grid grid-cols-2 gap-gutter-md">' +
            '<div class="rounded-md bg-light-surface-container-low border border-kintsugi-gold/70 p-gutter-md flex flex-col gap-gutter-xs">' +
              '<span class="font-label text-label-sm text-smoke-gray">Platillos activos</span>' +
              '<span class="font-headline text-headline-lg text-ink-black tabular-nums">' + activos + '</span>' +
              (agotados ? '<span class="font-body text-body-sm text-error">' + agotados + ' agotado' + (agotados > 1 ? 's' : '') + '</span>' : '') +
            '</div>' +
            '<div class="rounded-md bg-light-surface-container-low border border-kintsugi-gold/70 p-gutter-md flex flex-col gap-gutter-xs">' +
              '<span class="font-label text-label-sm text-smoke-gray">Promos vigentes</span>' +
              '<span class="font-headline text-headline-lg text-primary tabular-nums">' + promos + '</span>' +
            '</div>' +
          '</section>' +

          '<section class="flex flex-col gap-gutter-md">' +
            '<h2 class="font-headline text-title-md text-ink-black uppercase">¿Qué quieres editar?</h2>' +
            '<div class="grid grid-cols-1 gap-gutter-sm">' +
              acceso('platillos.html', 'bg-primary text-on-primary', 'ramen_dining', 'Platillos y precios', 'Ramen, sushi, entradas, bebidas y postres') +
              acceso('promos.html', 'bg-tertiary text-on-tertiary', 'local_offer', 'Promociones y banners', 'Activa o edita promos como 2x$150') +
              acceso('sushi.html', 'bg-secondary text-on-secondary', 'set_meal', 'Arma tu sushi', 'Rollos, ' + ings + ' ingredientes y precios extra') +
              acceso('ajustes.html', 'bg-ink-black text-washi', 'palette', 'Fondos y datos del negocio', 'Imágenes de fondo, horario y WhatsApp') +
            '</div>' +
          '</section>' +
        '</main>' +
        U.adminNav('panel');
    })();
  </script>
</body>
</html>
